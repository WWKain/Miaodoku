<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <meta
        name="description"
        content="Calcola il tuo Arcano Maggiore attraverso la tua data di nascita."
    >
    <title>Tarocchi — Arcano Maggiore</title>
    <link rel="stylesheet" href="res/tarots/style.css">
</head>
<body>
    <div class="stars-background svg-host" data-svg="res/tarots/stars.svg" aria-hidden="true"></div>

    <main class="page">
        <section class="hero">
            <div class="title-image svg-host" data-svg="res/tarots/title.svg" aria-label="Tarocchi"></div>
        </section>
        <section class="calculator">
            <div class="date-container">
                <label
                    for="birth-date"
                    class="visually-hidden"
                >
                    Data di nascita
                </label>
                <div class="date-input-wrapper">
                    <input
                        id="birth-date"
                        class="date-input"
                        type="text"
                        inputmode="numeric"
                        autocomplete="bday"
                        maxlength="8"
                        aria-label="Data di nascita"
                    >
                    <div class="date-digits" aria-hidden="true">
                        <span class="date-digit"></span>
                        <span class="date-digit"></span>
                        <span class="date-digit"></span>
                        <span class="date-digit"></span>
                        <span class="date-digit"></span>
                        <span class="date-digit"></span>
                        <span class="date-digit"></span>
                        <span class="date-digit"></span>
                    </div>
                    <div class="date-decoration svg-host" data-svg="res/tarots/date.svg" aria-hidden="true"></div>
                </div>
                <p
                    id="date-error"
                    class="date-error"
                    aria-live="polite"
                ></p>
            </div>
            <div
                class="methods"
                aria-label="Metodi di calcolo"
            >
                <button
                    type="button"
                    class="method-button"
                    data-method="digit"
                >
                    Somma delle cifre
                </button>
                <button
                    type="button"
                    class="method-button"
                    data-method="full"
                >
                    Somma completa
                </button>
                <button
                    type="button"
                    class="method-button"
                    data-method="reduced"
                >
                    Riduzione numerologica
                </button>
            </div>
        </section>
    </main>
    <div
        id="arcana-modal"
        class="modal"
        aria-hidden="true"
        role="dialog"
        aria-modal="true"
        aria-labelledby="arcana-title"
    >
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <button
                id="modal-close"
                class="modal-close"
                type="button"
                aria-label="Chiudi"
            >
                ×
            </button>
            <div class="arcana-header">
                <h1 id="arcana-title">
                    Arcano Maggiore
                </h1>
                <h2 id="arcana-name"></h2>
            </div>
            <div class="arcana-body">
                <div class="arcana-image-container">
                    <div id="arcana-image" class="arcana-image svg-host" aria-hidden="true"></div>
                </div>
                <div class="arcana-description">
                    <p id="arcana-text"></p>
                </div>
            </div>
        </div>
    </div>
    <script src="res/tarots/arcana-data.js"></script>
    <script src="res/tarots/script.js"></script>
</body>
</html>
