<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <meta
        name="description"
        content="Calcola il tuo Arcano Maggiore attraverso la tua data di nascita."
    >
    <title>Tarocchi — Arcano Maggiore</title>
    <link rel="stylesheet" href="svg/tarots/style.css">
</head>
<body>
    <div class="stars-background svg-host" data-svg="svg/tarots/stars.svg" aria-hidden="true"></div>

    <main class="page">
        <section class="hero">
            <div class="title-image svg-host" data-svg="svg/tarots/title.svg" aria-label="Tarocchi"></div>
        </section>
        <section class="calculator">
            <div class="date-container">
                <label
                    for="birth-date"
                    class="visually-hidden"
                >
                    Data di nascita
                </label>
                <div class="date-input-wrapper">
                    <input
                        id="birth-date"
                        class="date-input"
                        type="text"
                        inputmode="numeric"
                        autocomplete="bday"
                        maxlength="8"
                        aria-label="Data di nascita"
                    >
                    <div class="date-digits" aria-hidden="true">
                        <span class="date-digit"></span>
                        <span class="date-digit"></span>
                        <span class="date-digit"></span>
                        <span class="date-digit"></span>
                        <span class="date-digit"></span>
                        <span class="date-digit"></span>
                        <span class="date-digit"></span>
                        <span class="date-digit"></span>
                    </div>
                    <div class="date-decoration svg-host" data-svg="svg/tarots/date.svg" aria-hidden="true"></div>
                </div>
                <p
                    id="date-error"
                    class="date-error"
                    aria-live="polite"
                ></p>
            </div>
            <div
                class="methods"
                aria-label="Metodi di calcolo"
            >
                <button
                    type="button"
                    class="method-button"
                    data-method="simple"
                >
                    Metodo con somma semplice
                </button>
                <button
                    type="button"
                    class="method-button"
                    data-method="split"
                >
                    Metodo con divisione dell'anno
                </button>
                <button
                    type="button"
                    class="method-button"
                    data-method="full"
                >
                    Metodo con somma completa
                </button>
                <button
                    type="button"
                    class="method-button"
                    data-method="soul"
                >
                    Metodo con Personalità e Anima
                </button>
                <button
                    type="button"
                    class="method-button method-button-wide"
                    data-method="complete"
                >
                    Metodo con lettura completa
                </button>
            </div>
        </section>
    </main>
    <div
        id="personality-soul-modal"
        class="modal personality-soul-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="personality-soul-title"
    >
        <div class="modal-overlay"></div>
        <div class="modal-content personality-soul-content">
            <button
                id="personality-soul-close"
                class="modal-close"
                type="button"
                aria-label="Chiudi"
            >
                ×
            </button>
            <div class="arcana-header">
                <h1 id="personality-soul-title">
                    Personalità e Anima
                </h1>
            </div>
            <div class="personality-soul-grid">
                <div class="personality-soul-column">
                    <h2>
                        Personalità
                    </h2>
                    <button class="soul-card" data-soul-index="0" type="button"
                        aria-label="Apri la carta della Personalità">
                        <div class="soul-card-image"></div>
                    </button>
                </div>
                <div class="personality-soul-column">
                    <h2>
                        Anima
                    </h2>
                    <button class="soul-card" data-soul-index="1" type="button"
                        aria-label="Apri la carta dell'Anima">
                        <div class="soul-card-image"></div>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div
        id="arcana-modal"
        class="modal"
        aria-hidden="true"
        role="dialog"
        aria-modal="true"
        aria-labelledby="arcana-title"
    >
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <button
                id="modal-close"
                class="modal-close"
                type="button"
                aria-label="Chiudi"
            >
                ×
            </button>
            <div class="arcana-header">
                <h1 id="arcana-title">
                    Arcano Maggiore
                </h1>
                <h2 id="arcana-name"></h2>
            </div>
            <div class="arcana-body">
                <div class="arcana-image-container">
                    <div id="arcana-image" class="arcana-image svg-host" aria-hidden="true"></div>
                </div>
                <div class="arcana-description">
                    <p id="arcana-text"></p>
                </div>
            </div>
        </div>
    </div>
    <script src="svg/tarots/arcana-data.js"></script>
    <script src="svg/tarots/script.js"></script>
</body>
</html>
